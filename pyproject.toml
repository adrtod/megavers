[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megavers"
version = "0.2.0"
description = "Analyze and prune file version history in MEGA cloud storage"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Adrien Todeschini", email = "adrien.todeschini@findnorder.com"},
]
keywords = ["mega", "cloud", "storage", "versioning", "cleanup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]

# No runtime dependencies — MEGAcmd must be installed separately.

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage  = "https://github.com/adrtod/megavers"
Repository = "https://github.com/adrtod/megavers"
Issues    = "https://github.com/adrtod/megavers/issues"
Changelog = "https://github.com/adrtod/megavers/blob/main/CHANGELOG.md"

[project.scripts]
megavers-analyze     = "megavers.analyze:main"
megavers-config-init = "megavers.config:main_config_init"
megavers-config-list = "megavers.config:main_config_list"
megavers-prune       = "megavers.prune:main"

[tool.hatch.build.targets.sdist]
include = [
    "/megavers",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
