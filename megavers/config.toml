# megavers config
#
# This is the bundled default, used only when no .megavers.toml is found in
# the current directory and no config.toml is found in
# ~/.config/megavers/config.toml. It ships with a few generally-applicable
# filters active (git internals, OS/editor junk files, Python caches) and one
# commented-out example for a more workflow-specific case. To customize, run
# `megavers-prune --init-config`, or copy this file to ./.megavers.toml or
# ~/.config/megavers/config.toml and edit it there.
#
# Define named filters below. All filters are active by default.
# Use --filter NAME on the CLI to activate only specific ones.
#
# Filter matching logic (within a single filter):
#   - path_contains: file path must contain at least one of these strings
#                     (case-sensitive, matching MEGA's own path semantics)
#   - extensions:    file extension must be in this list
#   - A filter needs at least one of the two — an empty filter is rejected,
#     since it would otherwise match every file in the account.
#   - If both are set: file must satisfy BOTH conditions (AND).
#   - If only one is set: only that condition is checked.
#
# Across filters: OR logic — a file is selected if it matches ANY active filter.

[[filter]]
name = "os-junk"
description = "OS-generated metadata files (macOS Finder, Windows Explorer)"
path_contains = ["/.DS_Store", "/Thumbs.db", "/desktop.ini"]

[[filter]]
name = "editor-swap"
description = "Editor swap files (e.g. Vim)"
extensions = [".swp"]

[[filter]]
name = "office-locks"
description = "Microsoft Office lock files, created while a document is open"
path_contains = ["/~$"]

[[filter]]
name = "python-cache-dirs"
description = "Python cache and build-artifact directories"
path_contains = [
    "/__pycache__/", "/.pytest_cache/", "/.mypy_cache/", "/.ruff_cache/",
    ".egg-info/", "/.ipynb_checkpoints/", "/.numba_cache/",
    "/jax_cache/", "/.jax_cache/",
]

[[filter]]
name = "python-bytecode"
description = "Compiled Python bytecode and JIT cache files (CPython, Numba)"
extensions = [".pyc", ".pyo", ".nbi", ".nbc"]

[[filter]]
name = "git"
description = "Git repository internals (pack files, loose objects, index, etc.)"
path_contains = ["/.git/"]

